---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: local-path-provisioner
    namespace: flux-system
  values:
    storageClass:
      name: local-path
      defaultClass: true
    nodePathMap:
    - node: twilight
      paths:
        - /mnt/storage1
    - node: fluttershy
      paths:
        - /mnt/storage1
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
        - /srv/storage1