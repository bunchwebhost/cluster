---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: twilight
auto: off

---
apiVersion: v1alpha1
kind: LinkConfig
name: net0
up: true
addresses:
  - address: 10.64.0.5/16
routes:
  - gateway: 10.64.0.1

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "9c:7b:ef:27:ab:6e"
