---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: rarity
auto: off

---
apiVersion: v1alpha1
kind: LinkConfig
name: net0
up: true
addresses:
  - address: 10.64.0.8/16
routes:
  - gateway: 10.64.0.1

---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "a8:b1:3b:73:ef:3f"
